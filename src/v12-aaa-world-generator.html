<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NETRACER V12 AAA World Generator</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #020507; color: #f3fbff; font-family: Inter, Segoe UI, sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
    .panel { position: fixed; z-index: 4; border: 1px solid rgba(147,236,255,.28); border-radius: 0; background: linear-gradient(180deg, rgba(5,17,17,.78), rgba(4,8,12,.58)); backdrop-filter: blur(12px); box-shadow: 0 18px 70px rgba(0,0,0,.38); }
    .essence { top: 26px; left: 26px; width: min(620px, calc(100vw - 52px)); padding: 22px 26px; }
    .stats { position: fixed; z-index: 5; top: 26px; right: 26px; display: grid; grid-template-columns: repeat(2, minmax(160px, 1fr)); gap: 10px; width: min(390px, calc(100vw - 52px)); background: transparent; border: 0; box-shadow: none; }
    .stat { padding: 16px 18px; border: 1px solid rgba(147,236,255,.25); background: rgba(4,13,14,.72); }
    .narrator { left: 26px; bottom: 26px; width: min(900px, calc(100vw - 52px)); padding: 18px 22px; }
    .kicker { color: #9df6ff; font-size: 11px; font-weight: 900; letter-spacing: .04em; margin-bottom: 10px; text-transform: uppercase; }
    h1 { font-size: 19px; line-height: 1.22; margin: 0 0 12px; max-width: 540px; }
    .body { color: #c7d7d8; font-size: 14px; line-height: 1.45; }
    .metric-label { color: #a6bdc0; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .metric-value { color: #fff; font-size: 25px; font-weight: 950; margin-top: 8px; }
    .dock { position: fixed; z-index: 6; right: 26px; bottom: 26px; display: grid; grid-template-columns: repeat(2, 92px); gap: 10px; }
    .dock button, .dock a { border: 1px solid rgba(160,255,230,.22); color: #eafff7; background: rgba(24,57,45,.72); padding: 13px 10px; font-size: 13px; font-weight: 850; text-align: center; text-decoration: none; cursor: pointer; }
    .dock button.active { background: rgba(112,255,206,.24); border-color: rgba(170,255,222,.52); }
    .hint { margin-top: 12px; color: #d9ede8; font-size: 12px; opacity: .9; }
    .reticle { position: fixed; z-index: 3; left: 50%; top: 50%; width: 18px; height: 18px; border: 1px solid rgba(255,255,255,.58); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: .72; }
    @media (max-width: 900px) {
      .stats { left: 26px; right: auto; top: 220px; grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .dock { grid-template-columns: repeat(4, 76px); }
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="reticle"></div>
  <section class="panel essence">
    <div class="kicker">Semantic Essence</div>
    <h1 id="axiom">World-weaver axiom loading</h1>
    <div class="body" id="essence">Generating...</div>
  </section>
  <section class="stats">
    <div class="stat"><div class="metric-label">Dominant</div><div class="metric-value" id="dominant">-</div></div>
    <div class="stat"><div class="metric-label">Energy</div><div class="metric-value" id="energy">-</div></div>
    <div class="stat"><div class="metric-label">Biome</div><div class="metric-value" id="biome">-</div></div>
    <div class="stat"><div class="metric-label">Life</div><div class="metric-value" id="life">-</div></div>
  </section>
  <section class="panel narrator">
    <h1 id="location">-</h1>
    <div class="body" id="beat">-</div>
    <div class="hint" id="controls">Click to enter. WASD walk, mouse look, Shift drift, C free camera, N narrator beat, Esc exits pointer lock.</div>
  </section>
  <nav class="dock">
    <a href="/v11/active-cognition-instrument">V11</a>
    <button id="enter">Enter</button>
    <button id="narrate">Narrate</button>
    <button id="camera">Camera</button>
  </nav>
  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl", { antialias: true, alpha: false, depth: true });
    if (!gl) document.body.innerHTML = "<p>WebGL unavailable.</p>";
    let world = null, time = 0, beat = 0, freeCamera = false;
    const keys = new Set();
    const player = { pos: [0, 8, 12], yaw: 0, pitch: -0.12, speed: 0.18 };
    const vs = `
      attribute vec3 position; attribute vec3 color;
      uniform mat4 mvp; uniform float pointScale;
      varying vec3 vColor;
      void main(){ vColor=color; gl_Position=mvp*vec4(position,1.0); gl_PointSize=pointScale/max(.25,gl_Position.w); }
    `;
    const fsLine = `precision mediump float; varying vec3 vColor; void main(){ gl_FragColor=vec4(vColor,1.0); }`;
    const fsPoint = `
      precision mediump float; varying vec3 vColor;
      void main(){ vec2 p=gl_PointCoord*2.0-1.0; float d=dot(p,p); if(d>1.0) discard; float g=1.0-smoothstep(.04,1.0,d); gl_FragColor=vec4(vColor*(.45+g*1.9),1.0); }
    `;
    const triProgram = program(vs, fsLine), lineProgram = program(vs, fsLine), pointProgram = program(vs, fsPoint);
    const triBuffer = gl.createBuffer(), lineBuffer = gl.createBuffer(), pointBuffer = gl.createBuffer();
    let terrainVertices = [], networkVertices = [], lifeVertices = [], towerVertices = [];

    async function load() {
      const response = await fetch("/api/v12/aaa-world-generator?n=7", { cache: "no-store" });
      world = await response.json();
      player.pos = [...world.walker.spawn];
      buildGeometry();
      updateHud();
    }

    function updateHud() {
      document.getElementById("axiom").textContent = world.world_axiom;
      document.getElementById("essence").textContent = `growth=${world.semantic_essence.growth} strata=${world.semantic_essence.strata} morphologies=${world.semantic_essence.morphologies} spectral=${world.semantic_essence.spectral} coherence=${world.semantic_essence.coherence} active remainder=${world.semantic_essence.active_remainder}`;
      document.getElementById("dominant").textContent = world.generator_geometry.dominant_carrier;
      document.getElementById("energy").textContent = world.source_state.v11.meaning_field.total_cognitive_energy.toFixed(3);
      document.getElementById("biome").textContent = world.semantic_essence.biome;
      document.getElementById("life").textContent = world.life.count;
      document.getElementById("location").textContent = world.narrator.current;
      document.getElementById("beat").textContent = world.narrator.beats[beat % world.narrator.beats.length];
      document.getElementById("camera").classList.toggle("active", freeCamera);
    }

    function buildGeometry() {
      terrainVertices = [];
      const size = world.terrain.grid_size;
      const p = world.terrain.points;
      for (let z = 0; z < size - 1; z++) {
        for (let x = 0; x < size - 1; x++) {
          const a = p[z * size + x], b = p[z * size + x + 1], c = p[(z + 1) * size + x], d = p[(z + 1) * size + x + 1];
          pushTri(terrainVertices, a, c, b);
          pushTri(terrainVertices, b, c, d);
        }
      }
      lifeVertices = [];
      for (const e of world.life.entities) {
        const c = colorCarrier(e.carrier, e.glow);
        lifeVertices.push(e.position[0], e.position[1], e.position[2], c[0], c[1], c[2]);
      }
      towerVertices = [];
      for (const t of world.cosmos_towers) {
        const c = colorCarrier(t.carrier, 1);
        towerVertices.push(t.position[0], t.position[1], t.position[2], c[0], c[1], c[2]);
        towerVertices.push(t.position[0], t.position[1] + t.height, t.position[2], c[0], c[1], c[2]);
      }
      networkVertices = [];
      const nodes = [...world.culture.nodes, ...world.cosmos_towers.slice(0, 24)];
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i].position, b = nodes[(i * 7 + 3) % nodes.length].position;
        networkVertices.push(a[0], a[1] + 1, a[2], .34, .78, .9, b[0], b[1] + 1, b[2], .8, .42, .72);
      }
    }

    function pushTri(out, a, b, c) {
      for (const p of [a,b,c]) {
        const col = terrainColor(p);
        out.push(p.x, p.y, p.z, col[0], col[1], col[2]);
      }
    }

    function terrainColor(p) {
      return [
        clamp(.22 + p.heat * .38 + p.culture * .18, 0, 1),
        clamp(.32 + p.signal * .42, 0, 1),
        clamp(.38 + p.culture * .46 - p.heat * .1, 0, 1)
      ];
    }

    function frame() {
      resize(); time += 0.016; updatePlayer();
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.enable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0.006, 0.014, 0.018, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      if (!world) return requestAnimationFrame(frame);
      const aspect = canvas.width / Math.max(1, canvas.height);
      const projection = perspective(64 * Math.PI / 180, aspect, .08, 420);
      const dir = direction();
      const eye = player.pos;
      const center = [eye[0] + dir[0], eye[1] + dir[1], eye[2] + dir[2]];
      const vp = multiply(projection, lookAt(eye, center, [0, 1, 0]));
      draw(triProgram, triBuffer, terrainVertices, gl.TRIANGLES, vp, 1);
      draw(lineProgram, lineBuffer, towerVertices, gl.LINES, vp, 1);
      draw(lineProgram, lineBuffer, networkVertices, gl.LINES, vp, 1);
      drawSkyFibers(vp);
      draw(pointProgram, pointBuffer, lifeVertices, gl.POINTS, vp, 125);
      requestAnimationFrame(frame);
    }

    function drawSkyFibers(vp) {
      const v = [];
      for (let i = 0; i < 260; i++) {
        const a = i * 12.9898;
        const r = 40 + (i % 19) * 6;
        const y = 24 + (i % 11) * 3.4;
        const x1 = Math.cos(a + time * .03) * r;
        const z1 = Math.sin(a) * r;
        const x2 = Math.cos(a + 1.7) * (r + 16);
        const z2 = Math.sin(a + time * .02) * (r + 16);
        v.push(x1, y, z1, .18, .48, .6, x2, y + Math.sin(time + i) * 7, z2, .7, .36, .62);
      }
      draw(lineProgram, lineBuffer, v, gl.LINES, vp, 1);
    }

    function updatePlayer() {
      const drift = keys.has("Shift") ? 0.46 : player.speed;
      const dir = direction(), right = [Math.cos(player.yaw), 0, -Math.sin(player.yaw)];
      if (keys.has("w")) move(dir, drift);
      if (keys.has("s")) move(dir, -drift);
      if (keys.has("d")) move(right, drift);
      if (keys.has("a")) move(right, -drift);
      if (!freeCamera && world) player.pos[1] = sampleHeight(player.pos[0], player.pos[2]) + 2.4;
    }

    function move(vec, amount) {
      player.pos[0] += vec[0] * amount;
      player.pos[1] += vec[1] * amount;
      player.pos[2] += vec[2] * amount;
    }

    function direction() {
      return [Math.sin(player.yaw) * Math.cos(player.pitch), Math.sin(player.pitch), -Math.cos(player.yaw) * Math.cos(player.pitch)];
    }

    function sampleHeight(x, z) {
      const t = world.terrain, gx = clamp(Math.round(x / t.scale + t.grid_size / 2), 0, t.grid_size - 1), gz = clamp(Math.round(z / t.scale + t.grid_size / 2), 0, t.grid_size - 1);
      return t.points[gz * t.grid_size + gx]?.y || 0;
    }

    function colorCarrier(carrier, glow) {
      const map = { R:[.85,.95,1], C:[.4,1,.9], H:[1,.58,.32], O:[.52,.72,1], A_n:[1,.86,.38], meaning:[.9,.58,1], traffic:[.3,.88,1] };
      return (map[carrier] || [.8,.9,1]).map((v) => clamp(v * glow + .12, 0, 1));
    }

    function draw(prog, buffer, data, mode, mvp, pointScale) {
      if (!data.length) return;
      gl.useProgram(prog); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.DYNAMIC_DRAW);
      const pos = gl.getAttribLocation(prog, "position"), col = gl.getAttribLocation(prog, "color");
      gl.enableVertexAttribArray(pos); gl.vertexAttribPointer(pos, 3, gl.FLOAT, false, 24, 0);
      gl.enableVertexAttribArray(col); gl.vertexAttribPointer(col, 3, gl.FLOAT, false, 24, 12);
      gl.uniformMatrix4fv(gl.getUniformLocation(prog, "mvp"), false, new Float32Array(mvp));
      gl.uniform1f(gl.getUniformLocation(prog, "pointScale"), pointScale || 1);
      gl.drawArrays(mode, 0, data.length / 6);
    }
    function program(vsSrc, fsSrc){ const p=gl.createProgram(), v=shader(gl.VERTEX_SHADER,vsSrc), f=shader(gl.FRAGMENT_SHADER,fsSrc); gl.attachShader(p,v); gl.attachShader(p,f); gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
    function shader(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
    function resize(){ const d=devicePixelRatio||1,w=Math.floor(innerWidth*d),h=Math.floor(innerHeight*d); if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;} }
    function perspective(fovy, aspect, near, far){ const f=1/Math.tan(fovy/2), nf=1/(near-far); return [f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]; }
    function lookAt(eye, center, up){ const z=norm([eye[0]-center[0],eye[1]-center[1],eye[2]-center[2]]), x=norm(cross(up,z)), y=cross(z,x); return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]; }
    function multiply(a,b){ const o=new Array(16).fill(0); for(let r=0;r<4;r++)for(let c=0;c<4;c++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k]; return o; }
    function norm(a){ const l=Math.hypot(...a)||1; return a.map(v=>v/l); }
    function cross(a,b){ return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]; }
    function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
    function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

    canvas.onclick = () => canvas.requestPointerLock();
    document.getElementById("enter").onclick = () => canvas.requestPointerLock();
    document.getElementById("narrate").onclick = () => { beat++; updateHud(); };
    document.getElementById("camera").onclick = () => { freeCamera = !freeCamera; updateHud(); };
    window.addEventListener("keydown", (e) => { keys.add(e.key.toLowerCase()); if(e.key.toLowerCase()==="n"){ beat++; updateHud(); } if(e.key.toLowerCase()==="c"){ freeCamera=!freeCamera; updateHud(); } });
    window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
    window.addEventListener("mousemove", (e) => {
      if (document.pointerLockElement !== canvas) return;
      player.yaw -= e.movementX * 0.0022;
      player.pitch = clamp(player.pitch - e.movementY * 0.0018, -1.28, 1.08);
    });
    load().then(frame);
  </script>
</body>
</html>
