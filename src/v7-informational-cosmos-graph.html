<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NETRACER V7 Informational Cosmos Graph</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #010308; color: #f2fbff; font-family: Inter, Segoe UI, sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; }
    .hud { position: fixed; top: 18px; left: 18px; width: min(560px, calc(100vw - 36px)); padding: 14px 16px; border: 1px solid rgba(135, 230, 255, .32); border-radius: 8px; background: rgba(1, 4, 9, .7); backdrop-filter: blur(14px); pointer-events: none; }
    .title { font-size: 15px; font-weight: 850; margin-bottom: 9px; }
    .row { display: flex; justify-content: space-between; gap: 14px; color: #bed2dd; font-size: 12px; line-height: 1.55; }
    .value { color: #fff; text-align: right; }
    .legend { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(135, 230, 255, .18); color: #dceff7; font-size: 12px; line-height: 1.45; }
    .label { position: fixed; transform: translate(-50%, -50%); padding: 4px 7px; border-radius: 6px; background: rgba(1, 5, 10, .72); border: 1px solid rgba(148, 236, 255, .34); color: #f4fcff; font-size: 11px; font-weight: 850; pointer-events: none; white-space: nowrap; }
    .label.edge { color: #ffd58d; border-color: rgba(255, 197, 93, .36); }
    .dock { position: fixed; right: 18px; bottom: 18px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .dock a, .dock button { border: 0; border-radius: 8px; padding: 9px 11px; color: #031019; background: #8ee7ff; font-weight: 850; font-size: 12px; text-decoration: none; }
    .dock button.active { background: #ffc45d; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <section class="hud">
    <div class="title">V7 Informational Cosmos Graph</div>
    <div class="row"><span>mode</span><span class="value" id="mode">loading</span></div>
    <div class="row"><span>nodes</span><span class="value" id="nodes">0</span></div>
    <div class="row"><span>relationships</span><span class="value" id="relationships">0</span></div>
    <div class="row"><span>dominant</span><span class="value" id="dominant">-</span></div>
    <div class="row"><span>invariant</span><span class="value" id="invariant">-</span></div>
    <div class="row"><span>traffic</span><span class="value" id="traffic">-</span></div>
    <div class="row"><span>meaning rule</span><span class="value" id="meaning">-</span></div>
    <div class="legend">Spectator graph: motion, relation strength, algebraic carrier, and active remainder are rendered together. Drag to orbit, wheel to zoom, Space toggles semantic labels.</div>
  </section>
  <div id="labels"></div>
  <nav class="dock">
    <a href="/v6/hypercomplex-world">V6</a>
    <a href="/v5/aaa-cosmos">V5</a>
    <a href="/v4/version-cage">V4</a>
    <button id="labelsButton" class="active">Labels</button>
    <button id="reset">Reset</button>
  </nav>
  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl", { antialias: true, alpha: false, depth: true });
    if (!gl) document.body.innerHTML = "<p>WebGL unavailable.</p>";
    const labels = document.getElementById("labels");
    let state = null, time = 0, yaw = 0.75, pitch = -0.22, distance = 24, dragging = false, lx = 0, ly = 0, showLabels = true;

    const vs = `
      attribute vec3 position; attribute vec3 color;
      uniform mat4 mvp; uniform float pointScale;
      varying vec3 vColor;
      void main(){ vColor=color; gl_Position=mvp*vec4(position,1.0); gl_PointSize=pointScale/max(.2,gl_Position.w); }
    `;
    const fsPoint = `
      precision mediump float; varying vec3 vColor;
      void main(){ vec2 p=gl_PointCoord*2.0-1.0; float d=dot(p,p); if(d>1.0) discard; float g=1.0-smoothstep(.04,1.0,d); gl_FragColor=vec4(vColor*(.42+g*1.55),1.0); }
    `;
    const fsLine = `precision mediump float; varying vec3 vColor; void main(){ gl_FragColor=vec4(vColor,1.0); }`;
    const pointProgram = program(vs, fsPoint), lineProgram = program(vs, fsLine);
    const pointBuffer = gl.createBuffer(), lineBuffer = gl.createBuffer();

    async function load() {
      const response = await fetch("/api/v7/informational-cosmos-graph", { cache: "no-store" });
      state = await response.json();
      document.getElementById("mode").textContent = state.mode.replaceAll("_", " ");
      document.getElementById("nodes").textContent = state.graph.nodes.length;
      document.getElementById("relationships").textContent = state.graph.relationships.length;
      document.getElementById("dominant").textContent = state.spectator_semantics.current_dominant_carrier;
      document.getElementById("invariant").textContent = state.spectator_semantics.invariant;
      document.getElementById("traffic").textContent = `${state.source_state.lab_traffic.traffic_count} events · ${state.source_state.lab_traffic.topology_nodes} nodes`;
      document.getElementById("meaning").textContent = state.spectator_semantics.understanding_rule;
    }

    function frame() {
      resize(); time += 0.016;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.enable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0.002, 0.009, 0.02, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      const aspect = canvas.width / Math.max(1, canvas.height);
      const projection = perspective(58 * Math.PI / 180, aspect, .08, 180);
      const eye = [Math.cos(yaw)*Math.cos(pitch)*distance, Math.sin(pitch)*distance + 2, Math.sin(yaw)*Math.cos(pitch)*distance];
      const vp = multiply(projection, lookAt(eye, [0, 1, 0], [0, 1, 0]));
      drawBoundary(vp); drawRelationships(vp); drawNodes(vp); drawMeaningWeave(vp); updateLabels(vp);
      requestAnimationFrame(frame);
    }

    function drawBoundary(vp) {
      const v = [];
      for (let ring = 0; ring < 9; ring++) {
        const r = 4 + ring * 1.55;
        for (let i = 0; i <= 190; i++) {
          const a = i / 190 * Math.PI * 2;
          v.push(Math.cos(a + time*.05*ring)*r, Math.sin(a*2 + time*.35)*.22 + ring*.22 - 2.4, Math.sin(a - time*.04)*r, .1, .52, .95);
        }
      }
      draw(lineProgram, lineBuffer, v, gl.LINE_STRIP, vp, 1);
    }

    function drawRelationships(vp) {
      if (!state) return;
      const index = nodeIndex();
      const v = [];
      state.graph.relationships.forEach((edge, i) => {
        const a = index[edge.from], b = index[edge.to];
        if (!a || !b) return;
        const color = carrierColor(edge.carrier, edge.kind);
        const steps = 32;
        for (let s = 0; s < steps; s++) {
          const u = s / (steps - 1);
          const p = curved(a.position, b.position, u, edge.strength, i);
          v.push(p[0], p[1], p[2], color[0], color[1], color[2]);
        }
      });
      draw(lineProgram, lineBuffer, v, gl.LINE_STRIP, vp, 1);
    }

    function drawNodes(vp) {
      if (!state) return;
      const v = [];
      state.graph.nodes.forEach((node, i) => {
        const p = animatedNode(node, i);
        const c = node.kind === "seed-object" ? [.72, 1, .72] : node.kind === "spectator" ? [1, .9, .62] : carrierColor(node.carrier, node.kind);
        v.push(p[0], p[1], p[2], c[0], c[1], c[2]);
      });
      draw(pointProgram, pointBuffer, v, gl.POINTS, vp, 360);
    }

    function drawMeaningWeave(vp) {
      if (!state) return;
      const seed = state.graph.nodes.find(n => n.id === "seed-spinner-hand");
      const spectator = state.graph.nodes.find(n => n.id === "spectator-human");
      if (!seed || !spectator) return;
      const v = [];
      for (let strand = 0; strand < 7; strand++) {
        for (let i = 0; i < 70; i++) {
          const u = i / 69;
          const p = curved(seed.position, spectator.position, u, .9, strand);
          const spin = Math.sin(time*2 + u*18 + strand) * .35;
          v.push(p[0] + spin, p[1], p[2] - spin, .7, 1, .78);
        }
      }
      draw(lineProgram, lineBuffer, v, gl.LINE_STRIP, vp, 1);
    }

    function updateLabels(vp) {
      if (!state || !showLabels) { labels.innerHTML = ""; return; }
      const nodeLabels = state.graph.nodes.map((node, i) => ({ text: node.label, pos: animatedNode(node, i), cls: "label" }));
      const edgeLabels = state.graph.relationships.slice(0, 10).map((edge, i) => {
        const index = nodeIndex(); const a = index[edge.from], b = index[edge.to];
        return a && b ? { text: `${edge.kind} · ${edge.carrier}`, pos: curved(a.position, b.position, .5, edge.strength, i), cls: "label edge" } : null;
      }).filter(Boolean);
      labels.innerHTML = [...nodeLabels, ...edgeLabels].map((item) => {
        const p = project(item.pos, vp);
        return p.visible ? `<div class="${item.cls}" style="left:${p.x}px;top:${p.y}px">${item.text}</div>` : "";
      }).join("");
    }

    function nodeIndex() {
      return Object.fromEntries((state?.graph?.nodes || []).map((node, i) => [node.id, { ...node, position: animatedNode(node, i) }]));
    }
    function animatedNode(node, index) {
      const p = node.position || [0, 0, 0];
      const e = Math.max(.4, node.energy || 1);
      return [p[0] + Math.sin(time*.7 + index)*.16*e, p[1] + Math.cos(time*.5 + index)*.1*e, p[2] + Math.sin(time*.4 + index*1.7)*.13*e];
    }
    function curved(a, b, u, strength, index) {
      const lift = Math.sin(u * Math.PI) * (1.1 + strength * 2.4);
      const swirl = Math.sin(time*1.6 + u*10 + index) * .35 * strength;
      return [lerp(a[0], b[0], u) + swirl, lerp(a[1], b[1], u) + lift, lerp(a[2], b[2], u) - swirl];
    }
    function carrierColor(carrier, kind) {
      if (kind === "live-lab-traffic") return [.95, .95, 1];
      if (carrier === "C") return [.42, 1, .86];
      if (carrier === "O") return [1, .58, .24];
      if (carrier === "A_n") return [.8, .56, 1];
      if (carrier === "H") return [.48, .74, 1];
      if (carrier === "meaning") return [.74, 1, .74];
      return [.85, .93, 1];
    }
    function draw(activeProgram, buffer, vertices, mode, mvp, pointScale) {
      gl.useProgram(activeProgram); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.DYNAMIC_DRAW);
      const p = gl.getAttribLocation(activeProgram, "position"), c = gl.getAttribLocation(activeProgram, "color");
      gl.enableVertexAttribArray(p); gl.enableVertexAttribArray(c);
      gl.vertexAttribPointer(p, 3, gl.FLOAT, false, 24, 0); gl.vertexAttribPointer(c, 3, gl.FLOAT, false, 24, 12);
      gl.uniformMatrix4fv(gl.getUniformLocation(activeProgram, "mvp"), false, new Float32Array(mvp));
      const scale = gl.getUniformLocation(activeProgram, "pointScale"); if (scale) gl.uniform1f(scale, pointScale);
      gl.drawArrays(mode, 0, vertices.length / 6);
    }
    function resize(){ const dpr=Math.min(2, devicePixelRatio||1); const w=Math.floor(innerWidth*dpr), h=Math.floor(innerHeight*dpr); if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;} }
    function project(p,m){ const w=m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15]; if(w<=.05)return{visible:false}; const x=(m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12])/w, y=(m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13])/w; return{visible:Math.abs(x)<1.25&&Math.abs(y)<1.25,x:(x*.5+.5)*innerWidth,y:(-y*.5+.5)*innerHeight}; }
    function program(vs,fs){ const p=gl.createProgram(); gl.attachShader(p,shader(gl.VERTEX_SHADER,vs)); gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p)); return p; }
    function shader(t,s){ const h=gl.createShader(t); gl.shaderSource(h,s); gl.compileShader(h); if(!gl.getShaderParameter(h,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(h)); return h; }
    function perspective(fovy,aspect,near,far){ const f=1/Math.tan(fovy/2), nf=1/(near-far); return [f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,(2*far*near)*nf,0]; }
    function lookAt(e,c,u){ const z=normalize([e[0]-c[0],e[1]-c[1],e[2]-c[2]]), x=normalize(cross(u,z)), y=cross(z,x); return [x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1]; }
    function multiply(a,b){ const o=new Array(16).fill(0); for(let r=0;r<4;r++)for(let c=0;c<4;c++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k]; return o; }
    function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];} function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
    function normalize(v){ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; } function lerp(a,b,u){return a+(b-a)*u;}
    canvas.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointermove", e => { if(!dragging) return; yaw -= (e.clientX-lx)*.005; pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.clientY-ly)*.005)); lx=e.clientX; ly=e.clientY; });
    canvas.addEventListener("pointerup", () => dragging = false);
    canvas.addEventListener("wheel", e => { e.preventDefault(); distance = Math.max(8, Math.min(48, distance + Math.sign(e.deltaY)*1.4)); }, { passive: false });
    addEventListener("keydown", e => { if(e.code === "Space"){ showLabels = !showLabels; document.getElementById("labelsButton").classList.toggle("active", showLabels); }});
    document.getElementById("labelsButton").addEventListener("click", () => { showLabels = !showLabels; document.getElementById("labelsButton").classList.toggle("active", showLabels); });
    document.getElementById("reset").addEventListener("click", () => { yaw=.75; pitch=-.22; distance=24; });
    load(); setInterval(load, 2500); frame();
  </script>
</body>
</html>
