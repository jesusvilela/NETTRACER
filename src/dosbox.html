<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Netracer DOS Box</title>
  <style>
    :root {
      --bg: #090b10;
      --panel: #10151f;
      --line: rgba(123, 213, 255, 0.18);
      --ink: #d6f1ff;
      --muted: #7a90a6;
      --ok: #8effb8;
      --warn: #f5cf7c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(31, 73, 112, 0.22), transparent 32%), var(--bg);
      color: var(--ink);
      font-family: "Cascadia Code", monospace;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 12, 19, 0.88);
    }
    .bar-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .bar-link {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      text-decoration: none;
      font-size: 0.9em;
    }
    .muted { color: var(--muted); }
    .console {
      overflow: auto;
      padding: 16px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .line.ok { color: var(--ok); }
    .line.warn { color: var(--warn); }
    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 10px 14px 14px;
      border-top: 1px solid var(--line);
      background: rgba(7, 12, 19, 0.92);
    }
    input, button, select {
      font: inherit;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <div class="bar">
    <div>Trasgo DOS Box <span class="muted">local slang port</span></div>
    <div class="bar-nav">
      <a class="bar-link" href="/">v1</a>
      <a class="bar-link" href="/v2">v2</a>
      <a class="bar-link" href="/s1">.s1 observatory</a>
      <div id="status" class="muted">booting...</div>
    </div>
  </div>
  <div id="console" class="console"></div>
  <form id="cli">
    <input id="command" value="help" autocomplete="off" />
    <button type="submit">run</button>
  </form>
  <script>
    const consoleEl = document.getElementById('console');
    const statusEl = document.getElementById('status');
    const form = document.getElementById('cli');
    const input = document.getElementById('command');
    const state = { ws: null, nodeId: 'netracer', frames: [] };

    function print(text, cls = '') {
      const line = document.createElement('div');
      line.className = `line ${cls}`.trim();
      line.textContent = text;
      consoleEl.appendChild(line);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function help() {
      print('commands: help | nodes | topology | use <node> | tail | relay <frameId> | packs | upgrade [all|<node>] | inspect <path> | embed <path> | send <node> <path> | inbox [node] | receive <node> <path> | observatory | clear', 'ok');
    }

    function openObservatory() {
      window.open('/s1', '_blank', 'noopener,noreferrer');
      print('observatory :: opened /s1 in a new tab', 'ok');
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${protocol}//${location.host}/ws/slang`);
      state.ws = ws;
      ws.addEventListener('open', () => {
        statusEl.textContent = 'socket online';
        ws.send(JSON.stringify({ type: 'subscribe', nodeIds: [state.nodeId] }));
        print('boot ok :: subscribed to ' + state.nodeId, 'ok');
      });
      ws.addEventListener('message', (event) => {
        const message = JSON.parse(event.data);
        if (message.type === 'frame') {
          state.frames.push(message.frame);
          if (state.frames.length > 40) state.frames.shift();
          print(`${message.frame.nodeId}> ${message.frame.compacted}`);
        }
        if (message.type === 'nodeMessage') {
          print(`node::${message.message.nodeId} ${message.message.type} ${message.message.body}`, message.message.direction === 'from-node' ? 'warn' : 'ok');
        }
        if (message.type === 'packUpgrade') {
          print(`pack::${message.pack?.version || 'unknown'} ready`, 'ok');
        }
        if (message.type === 'multimodalInspection') {
          const inspection = message.inspection || {};
          print(`inspect::${inspection.filePath} carrier=${inspection.carrier?.validS1 ? 'valid' : 'missing'} embed=${inspection.embedded ? 'yes' : 'no'}`, inspection.carrier?.validS1 ? 'ok' : 'warn');
        }
        if (message.type === 'nodeMessageAck') {
          print(JSON.stringify(message.result, null, 2), message.result?.ok ? 'ok' : 'warn');
        }
        if (message.type === 'relayResult') {
          print(JSON.stringify(message.result, null, 2), message.result?.ok ? 'ok' : 'warn');
        }
        if (message.type === 'relay') {
          print(`relay::${message.relay.nodeId} ${message.relay.body}`, 'warn');
        }
      });
      ws.addEventListener('close', () => {
        statusEl.textContent = 'socket offline';
        print('socket closed', 'warn');
      });
    }

    async function listNodes() {
      const res = await fetch('/api/slang/topology');
      const data = await res.json();
      const header = [
        `active :: ${data.activePack?.version || 'none'}`,
        `coverage :: ${data.metrics?.boundNodes || 0}/${data.metrics?.totalNodes || 0} :: inboxNodes=${data.metrics?.inboxNodes || 0}`
      ];
      const lines = (data.nodes || []).map((node) =>
        `${node.id} :: ${node.kind} :: negotiated=${node.negotiated} :: inbox=${node.inboxCount} :: pack=${node.packVersion || '-'}`
      );
      print(header.concat(lines).join('\n'));
    }

    async function tail() {
      const res = await fetch(`/api/slang/snapshot?node=${encodeURIComponent(state.nodeId)}&limit=8`);
      const data = await res.json();
      for (const frame of data.data || []) {
        print(`${frame.nodeId}> ${frame.compacted}`);
      }
    }

    async function listPacks() {
      const res = await fetch('/api/slang/packs');
      const data = await res.json();
      const lines = [data.activePack ? `active :: ${data.activePack.version}` : 'active :: none'];
      for (const pack of data.data || []) {
        lines.push(`${pack.version} :: dialects=${(pack.dialectNames || []).length} :: sha=${String(pack.sha256 || '').slice(0, 16)}`);
      }
      print(lines.join('\n'));
    }

    async function inspectPath(filePath, embedCarrier = false) {
      const res = await fetch('/api/slang/multimodal/inspect', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ filePath, nodeId: state.nodeId, embedCarrier })
      });
      const data = await res.json();
      print(`${data.filePath} :: carrier=${data.carrier?.validS1 ? 'valid' : 'missing'} :: embedded=${data.embedded ? 'yes' : 'no'}`, data.carrier?.validS1 ? 'ok' : 'warn');
    }

    async function sendPath(nodeId, filePath) {
      const res = await fetch('/api/slang/multimodal/send', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ nodeId, filePath, embedCarrier: true })
      });
      const data = await res.json();
      print(`sent :: ${data.message?.nodeId} :: ${data.inspection?.preview || ''}`, data.inspection?.carrier?.validS1 ? 'ok' : 'warn');
    }

    async function showInbox(nodeId) {
      const target = nodeId || state.nodeId;
      const res = await fetch(`/api/slang/nodes/${encodeURIComponent(target)}/inbox?limit=8`);
      const data = await res.json();
      for (const message of data.data || []) {
        print(`${message.nodeId} [${message.direction}] ${message.type} :: ${message.body}`);
      }
    }

    async function receivePath(nodeId, filePath) {
      const res = await fetch(`/api/slang/nodes/${encodeURIComponent(nodeId)}/receive`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ filePath, metadata: { source: 'dosbox' } })
      });
      const data = await res.json();
      print(`received :: ${data.message?.nodeId} :: ${data.message?.body || ''}`, data.inspection?.carrier?.validS1 ? 'ok' : 'warn');
    }

    async function upgradePack(target = 'all') {
      const nodeIds = !target || target === 'all'
        ? []
        : [target === 'node' ? state.nodeId : target];
      const res = await fetch('/api/slang/packs/upgrade', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ nodeIds })
      });
      const data = await res.json();
      const scope = nodeIds.length ? nodeIds.join(',') : 'whole-trasgonet';
      print(`upgrade :: ${data.pack?.version || 'unknown'} -> ${scope}`, 'ok');
    }

    function parseArgs(raw) {
      return (raw.match(/"[^"]+"|[^\s]+/g) || []).map((part) => part.replace(/^"(.*)"$/, '$1'));
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const raw = input.value.trim();
      if (!raw) return;
      print(`C:\\SLANG> ${raw}`, 'ok');
      const [command, ...rest] = parseArgs(raw);
      if (command === 'help') help();
      else if (command === 'clear') consoleEl.textContent = '';
      else if (command === 'nodes') await listNodes();
      else if (command === 'topology') await listNodes();
      else if (command === 'tail') await tail();
      else if (command === 'packs') await listPacks();
      else if (command === 'upgrade') await upgradePack(rest[0] || 'all');
      else if (command === 'use') {
        state.nodeId = rest[0] || 'netracer';
        if (state.ws?.readyState === WebSocket.OPEN) {
          state.ws.send(JSON.stringify({ type: 'subscribe', nodeIds: [state.nodeId] }));
        }
        print(`subscribed :: ${state.nodeId}`, 'ok');
      } else if (command === 'inspect') {
        if (!rest[0]) print('inspect requires path', 'warn');
        else await inspectPath(rest[0], false);
      } else if (command === 'embed') {
        if (!rest[0]) print('embed requires path', 'warn');
        else await inspectPath(rest[0], true);
      } else if (command === 'send') {
        if (!rest[0] || !rest[1]) print('send requires node and path', 'warn');
        else await sendPath(rest[0], rest.slice(1).join(' '));
      } else if (command === 'inbox') {
        await showInbox(rest[0] || state.nodeId);
      } else if (command === 'receive') {
        if (!rest[0] || !rest[1]) print('receive requires node and path', 'warn');
        else await receivePath(rest[0], rest.slice(1).join(' '));
      } else if (command === 'relay') {
        const frameId = rest[0];
        if (!frameId) print('relay requires frame id', 'warn');
        else state.ws?.send(JSON.stringify({ type: 'relayFrame', nodeId: state.nodeId, frameId, mode: 'compacted' }));
      } else if (command === 'observatory') {
        openObservatory();
      } else {
        print(`unknown command :: ${command}`, 'warn');
      }
      input.select();
    });

    help();
    connect();
  </script>
</body>
</html>
