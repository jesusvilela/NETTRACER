<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NETRACER V5 AAA Cosmos</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #010306; color: #eef8ff; font-family: Inter, Segoe UI, sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .hud { position: fixed; top: 18px; left: 18px; width: min(440px, calc(100vw - 36px)); padding: 14px 16px; border: 1px solid rgba(118, 220, 255, .28); border-radius: 8px; background: rgba(1, 3, 6, .66); backdrop-filter: blur(12px); pointer-events: none; }
    .title { font-size: 14px; font-weight: 800; margin-bottom: 8px; }
    .row { display: flex; justify-content: space-between; gap: 12px; color: #b8cbd7; font-size: 12px; line-height: 1.55; }
    .value { color: #fff; text-align: right; }
    .dock { position: fixed; right: 18px; bottom: 18px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .dock a, .dock button { border: 0; border-radius: 8px; padding: 9px 11px; color: #031019; background: #8ee7ff; font-weight: 800; font-size: 12px; text-decoration: none; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <section class="hud">
    <div class="title">V5 AAA Cosmos</div>
    <div class="row"><span>projection</span><span class="value" id="projection">loading</span></div>
    <div class="row"><span>gpu</span><span class="value" id="gpu">WebGL</span></div>
    <div class="row"><span>worlds</span><span class="value" id="worlds">0</span></div>
    <div class="row"><span>bridges</span><span class="value" id="bridges">0</span></div>
    <div class="row"><span>codec</span><span class="value">§-LANG / nnn-ramdisk</span></div>
    <div class="row"><span>focus</span><span class="value" id="focus">free orbit</span></div>
  </section>
  <nav class="dock">
    <a href="http://127.0.0.1:8787/">V1</a>
    <a href="http://127.0.0.1:8788/cognition">V2</a>
    <a href="http://127.0.0.1:8789/v3/object-mesh">V3</a>
    <a href="/v4/version-cage">V4</a>
    <button id="reset">Reset</button>
  </nav>
  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl", { antialias: true, alpha: false, depth: true });
    if (!gl) document.body.innerHTML = "<p>WebGL unavailable.</p>";

    let state = null;
    let yaw = 0.7;
    let pitch = -0.28;
    let distance = 15;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let focus = [0, 0, 0];
    let time = 0;

    const vs = `
      attribute vec3 position;
      attribute vec3 color;
      uniform mat4 mvp;
      uniform float pointScale;
      varying vec3 vColor;
      void main() {
        vColor = color;
        gl_Position = mvp * vec4(position, 1.0);
        gl_PointSize = pointScale / max(0.24, gl_Position.w);
      }
    `;
    const fs = `
      precision mediump float;
      varying vec3 vColor;
      void main() {
        vec2 p = gl_PointCoord * 2.0 - 1.0;
        float d = dot(p, p);
        if (d > 1.0) discard;
        float glow = 1.0 - smoothstep(0.12, 1.0, d);
        gl_FragColor = vec4(vColor * (0.45 + glow), 1.0);
      }
    `;
    const lineFs = `
      precision mediump float;
      varying vec3 vColor;
      void main() { gl_FragColor = vec4(vColor, 1.0); }
    `;

    const pointProgram = program(vs, fs);
    const lineProgram = program(vs, lineFs);
    const pointBuffer = gl.createBuffer();
    const lineBuffer = gl.createBuffer();

    async function load() {
      const response = await fetch("/api/v5/aaa-cosmos");
      state = await response.json();
      document.getElementById("projection").textContent = state.projection.to;
      document.getElementById("worlds").textContent = state.worlds.length;
      document.getElementById("bridges").textContent = state.bridges.length;
      document.getElementById("gpu").textContent = gl.getParameter(gl.RENDERER);
    }

    function render() {
      resize();
      time += 0.014;
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.enable(gl.DEPTH_TEST);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0.003, 0.011, 0.02, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      const aspect = canvas.width / Math.max(1, canvas.height);
      const projection = perspective(55 * Math.PI / 180, aspect, 0.1, 100);
      const eye = [
        focus[0] + Math.cos(yaw) * Math.cos(pitch) * distance,
        focus[1] + Math.sin(pitch) * distance,
        focus[2] + Math.sin(yaw) * Math.cos(pitch) * distance
      ];
      const view = lookAt(eye, focus, [0, 1, 0]);
      const vp = multiply(projection, view);

      drawCage(vp);
      drawBridges(vp);
      drawWorlds(vp);
      requestAnimationFrame(render);
    }

    function drawWorlds(vp) {
      if (!state) return;
      const vertices = [];
      const colors = [[0.48, 0.95, 1], [1, 0.72, 0.35], [0.78, 0.55, 1]];
      state.worlds.forEach((world, index) => {
        const wobble = Math.sin(time * 2 + index) * 0.15;
        vertices.push(world.position[0], world.position[1] + wobble, world.position[2], ...colors[index % colors.length]);
      });
      drawArray(pointProgram, pointBuffer, vertices, gl.POINTS, vp, 520);
    }

    function drawBridges(vp) {
      if (!state) return;
      const byId = Object.fromEntries(state.worlds.map((world) => [world.id, world]));
      const vertices = [];
      state.bridges.forEach((bridge, index) => {
        const a = byId[bridge.from]?.position;
        const b = byId[bridge.to]?.position;
        if (!a || !b) return;
        for (let step = 0; step < 42; step += 1) {
          const u = step / 41;
          const lift = Math.sin(u * Math.PI) * (2.2 + index * 0.7);
          const swirl = Math.sin(time * 3 + u * Math.PI * 6 + index) * 0.35;
          const x = lerp(a[0], b[0], u) + swirl;
          const y = lerp(a[1], b[1], u) + lift;
          const z = lerp(a[2], b[2], u) + Math.cos(time * 2 + u * 8 + index) * 0.35;
          vertices.push(x, y, z, 1.0, 0.56 + index * 0.12, 0.25);
        }
      });
      drawArray(lineProgram, lineBuffer, vertices, gl.LINE_STRIP, vp, 1);
    }

    function drawCage(vp) {
      const vertices = [];
      for (let ring = -4; ring <= 4; ring += 1) {
        for (let i = 0; i <= 180; i += 1) {
          const a = (i / 180) * Math.PI * 2;
          const r = 3 + Math.abs(ring) * 0.9;
          const x = Math.cos(a + time * 0.16 * Math.sign(ring || 1)) * r;
          const y = ring * 0.65 + Math.sin(a * 3 + time) * 0.08;
          const z = Math.sin(a - time * 0.1) * r;
          vertices.push(x, y, z, 0.22, 0.64, 0.92);
        }
      }
      drawArray(lineProgram, lineBuffer, vertices, gl.LINE_STRIP, vp, 1);
    }

    function drawArray(activeProgram, buffer, vertices, mode, mvp, pointScale) {
      gl.useProgram(activeProgram);
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.DYNAMIC_DRAW);
      const pos = gl.getAttribLocation(activeProgram, "position");
      const col = gl.getAttribLocation(activeProgram, "color");
      gl.enableVertexAttribArray(pos);
      gl.enableVertexAttribArray(col);
      gl.vertexAttribPointer(pos, 3, gl.FLOAT, false, 24, 0);
      gl.vertexAttribPointer(col, 3, gl.FLOAT, false, 24, 12);
      gl.uniformMatrix4fv(gl.getUniformLocation(activeProgram, "mvp"), false, new Float32Array(mvp));
      const scaleLoc = gl.getUniformLocation(activeProgram, "pointScale");
      if (scaleLoc) gl.uniform1f(scaleLoc, pointScale);
      gl.drawArrays(mode, 0, vertices.length / 6);
    }

    function resize() {
      const dpr = Math.min(2, devicePixelRatio || 1);
      const w = Math.floor(innerWidth * dpr);
      const h = Math.floor(innerHeight * dpr);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    }

    canvas.addEventListener("pointerdown", (event) => { dragging = true; lastX = event.clientX; lastY = event.clientY; canvas.setPointerCapture(event.pointerId); });
    canvas.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      yaw -= (event.clientX - lastX) * 0.006;
      pitch = Math.max(-1.2, Math.min(1.2, pitch - (event.clientY - lastY) * 0.006));
      lastX = event.clientX; lastY = event.clientY;
    });
    canvas.addEventListener("pointerup", () => { dragging = false; });
    canvas.addEventListener("wheel", (event) => { event.preventDefault(); distance = Math.max(6, Math.min(34, distance + Math.sign(event.deltaY) * 1.2)); }, { passive: false });
    addEventListener("keydown", (event) => {
      if (!state) return;
      const index = Number(event.key) - 1;
      if (index >= 0 && index < state.worlds.length) {
        focus = state.worlds[index].position.slice();
        document.getElementById("focus").textContent = state.worlds[index].id;
      }
      if (event.key.toLowerCase() === "r") {
        focus = [0, 0, 0]; distance = 15; yaw = 0.7; pitch = -0.28;
        document.getElementById("focus").textContent = "free orbit";
      }
    });
    document.getElementById("reset").addEventListener("click", () => {
      focus = [0, 0, 0]; distance = 15; yaw = 0.7; pitch = -0.28;
      document.getElementById("focus").textContent = "free orbit";
    });

    function program(vertexSource, fragmentSource) {
      const p = gl.createProgram();
      gl.attachShader(p, shader(gl.VERTEX_SHADER, vertexSource));
      gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fragmentSource));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      return p;
    }
    function shader(type, source) {
      const s = gl.createShader(type);
      gl.shaderSource(s, source);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    function lerp(a, b, u) { return a + (b - a) * u; }
    function perspective(fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
      return [f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,(2*far*near)*nf,0];
    }
    function lookAt(eye, center, up) {
      const z = normalize([eye[0]-center[0], eye[1]-center[1], eye[2]-center[2]]);
      const x = normalize(cross(up, z));
      const y = cross(z, x);
      return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -dot(x,eye),-dot(y,eye),-dot(z,eye),1];
    }
    function multiply(a, b) {
      const out = new Array(16).fill(0);
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) for (let k = 0; k < 4; k++) out[c*4+r] += a[k*4+r] * b[c*4+k];
      return out;
    }
    function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
    function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
    function normalize(v){ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; }

    load();
    render();
  </script>
</body>
</html>
