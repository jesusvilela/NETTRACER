<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TELOS W|W' Hyperdom Console</title>
<style>
  body { margin: 0; background: #0a0a0c; color: #e0e0e2; font-family: 'Inter', sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: absolute; top: 20px; left: 20px; width: 320px; background: rgba(10, 10, 12, 0.85); padding: 20px; border: 1px solid #333; border-radius: 8px; backdrop-filter: blur(10px); }
  h1 { font-size: 18px; margin: 0 0 10px 0; color: #00d2ff; }
  .metric { margin-bottom: 15px; }
  .label { font-size: 11px; text-transform: uppercase; color: #888; }
  .value { font-size: 16px; font-weight: 600; color: #fff; }
  .bar-bg { height: 4px; background: #222; margin-top: 4px; border-radius: 2px; position: relative; }
  .bar-fg { height: 100%; background: #00d2ff; border-radius: 2px; transition: width 0.3s ease; }
  #log { position: absolute; bottom: 20px; left: 20px; right: 20px; height: 120px; background: rgba(0,0,0,0.5); padding: 10px; font-family: monospace; font-size: 12px; color: #0f0; overflow-y: auto; border: 1px solid #333; }
  .status-tag { display: inline-block; padding: 2px 6px; font-size: 10px; border-radius: 4px; margin-left: 8px; }
  .tag-pass { background: #004400; color: #0f0; }
  .tag-partial { background: #444400; color: #ff0; }
</style>
</head>
<body>
<div id="ui">
  <h1>W|W' TELOS ENGINE</h1>
  <div class="metric">
    <div class="label">ï¿½307 Frustration Index <span class="status-tag tag-pass">PASS</span></div>
    <div class="value" id="val-kernel">2 / 5</div>
    <div class="bar-bg"><div class="bar-fg" id="bar-kernel" style="width: 40%"></div></div>
  </div>
  <div class="metric">
    <div class="label">Berry Phase (Rad) <span class="status-tag tag-partial">PARTIAL</span></div>
    <div class="value" id="val-berry">3.1416</div>
    <div class="bar-bg"><div class="bar-fg" id="bar-berry" style="width: 100%"></div></div>
  </div>
  <div class="metric">
    <div class="label">Loxodromic Rigidity <span class="status-tag tag-pass">PASS</span></div>
    <div class="value" id="val-rigidity">0.8710</div>
    <div class="bar-bg"><div class="bar-fg" id="bar-rigidity" style="width: 87%"></div></div>
  </div>
  <div class="metric">
    <div class="label">Hegelian Residue</div>
    <div class="value" id="val-recognition">0.9856</div>
    <div class="bar-bg"><div class="bar-fg" id="bar-recognition" style="width: 98%"></div></div>
  </div>
  <div style="margin-top: 20px; font-size: 11px; color: #555;">
    V2.0.0-TELOS | N.NNN.MATRIXED HYPERBOLIC
  </div>
</div>
<div id="log"></div>

<script>
  const canvas = document.createElement('canvas');
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const particles = [];
  const knots = 7;
  const rings = 3;

  class Fiber {
    constructor(r, theta, depth) {
      this.r = r;
      this.theta = theta;
      this.depth = depth;
      this.phase = Math.random() * Math.PI * 2;
    }
    draw(t) {
      const x = width / 2 + Math.cos(this.theta + t * 0.1 / this.depth) * this.r * (1 + 0.05 * Math.sin(t * 2 + this.phase));
      const y = height / 2 + Math.sin(this.theta + t * 0.1 / this.depth) * this.r * (1 + 0.05 * Math.sin(t * 2 + this.phase));
      
      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${180 + this.depth * 20}, 100%, 70%, ${0.3 + 0.7 * Math.sin(t + this.phase)})`;
      ctx.fill();
    }
  }

  const fibers = [];
  for (let d = 1; depth <= rings; d++) {
    const radius = 100 * d;
    const count = 12 * d;
    for (let i = 0; i < count; i++) {
      fibers.push(new Fiber(radius, (i / count) * Math.PI * 2, d));
    }
  }

  function addLog(msg) {
    const log = document.getElementById('log');
    const div = document.createElement('div');
    div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  let frame = 0;
  function animate() {
    frame++;
    ctx.fillStyle = 'rgba(10, 10, 12, 0.1)';
    ctx.fillRect(0, 0, width, height);

    // Draw Poincaré boundary
    ctx.beginPath();
    ctx.arc(width/2, height/2, 400, 0, Math.PI * 2);
    ctx.strokeStyle = '#333';
    ctx.stroke();

    fibers.forEach(f => f.draw(frame * 0.01));

    if (frame % 60 === 0) {
      const k = (2 + Math.random() * 0.1).toFixed(4);
      document.getElementById('val-kernel').textContent = `${Math.floor(Math.random()*3)} / 5`;
      document.getElementById('val-rigidity').textContent = (0.8 + Math.random() * 0.1).toFixed(4);
      addLog(`ï¿½307_CHECK: parity_split=${(Math.random()>0.5?"even":"odd")} rank=${Math.floor(Math.random()*5)}`);
    }

    requestAnimationFrame(animate);
  }

  addLog("TELOS Engine Initialized. W|W' Mission: MANTLE_PROTOCOL.");
  addLog("Mapping ï¿½307 wall... L0..L8 strata detected.");
  animate();
</script>
</body>
</html>
